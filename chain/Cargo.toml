[package]
name = "chain"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.217", features = ["derive"] }
bincode = "2.0.1"
#rayon = "1.10.0"
blake3 = { version = "1.8.2", optional = true }
rocksdb = { version = "0.23.0", optional = true }
libp2p = { version = "0.56.0", features = [
 "gossipsub", "identify", "kad", "macros", "mdns", "ping", "quic", #"tokio"
] }
#tokio = { version = "1.47.1", features = ["full"] }
logging_timer = "1.1.1"
zstd = "0.13.2"
ed25519 = { version = "2.2.3", optional = true }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = "0.6.4"
secp256k1 = { version = "0.31.1", features = ["global-context", "rand", "hashes", "std"], optional = true }
ctrlc = "3.4.7"
const_format = { version = "0.2.34", features = ["fmt"] }
serde_json = "1.0.142"
lazy_static = "1.5.0"
rand = "0.9.2"
log = "0.4.27"
rcgen = "0.14.3"
ring = { version = "0.17.8", features = ["std"] }
bytes = "1.10.1"
maplit = "1.0.2"
afl = "0.15.20"
pretty_env_logger = "0.5.0"
clap = { version = "4.5.42", features = ["derive"] }
anyhow = "1.0.98"
matches = "0.1.10"
revm = { version = "28.0.0", optional = true }
ed25519-dalek-blake3 = { git = "https://github.com/germ3n/ed25519-dalek-blake3", branch = "master", optional = true }
mlua = { git = "https://github.com/germ3n/mlua", branch = "main", features = ["luau", "vendored", "send", "serialize", "macros"], optional = true }
hex = "0.4.3"
likely_stable = "0.1.3"
xxhash-rust = { version = "0.8.5", features = ["xxh3", "const_xxh3"] }
astra = { version = "0.4.0", optional = true }
http-body-util = "0.1.3"
sha2 = { version = "0.10.9", features = ["asm"], optional = true }
sha3 = { version = "0.10.8", optional = true }
http = "1.3.1"
matchit = { version = "0.8.6", optional = true }
paste = "1.0.15"
primitive-types = "0.13.1"
num-traits = "0.2.19"
solana-svm = { version = "2.3.7", optional = true }

[features]
default = ["evm", "lvm", "blake3", "edblake", "secp256k1", "ed25519", "halving-bitcoin", "sha2", "sha3", "keccak", "rocksdb", "rpc-json", "svm"]
evm = ["revm"]
lvm = ["mlua"]
edblake = ["ed25519-dalek-blake3", "blake3"]
halving-bitcoin = []
rpc-json = ["astra", "matchit"]
keccak = ["sha3"]
svm = ["solana-svm"]